name: Update news

on:
  schedule:
    - cron: "0 10,16,22 * * *"   # 6am, noon, 6pm Eastern
  workflow_dispatch:              # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check feeds (informational, never fails the run)
        continue-on-error: true
        run: python fetch_news.py --check

      - run: python fetch_news.py

      - name: Commit if anything changed
        run: |
          git config user.name  "news bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "News: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
